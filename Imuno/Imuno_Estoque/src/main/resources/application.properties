# ==========================================
# CONFIGURAÇÃO DA APLICAÇÃO
# ==========================================
spring.application.name=Imuno_Estoque
server.port=8082

# ==========================================
# BANCO DE DADOS - POSTGRESQL
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/imuno_db
spring.datasource.username=postgres
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

# update = cria/altera tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update

# mostra SQL no terminal
spring.jpa.show-sql=true

# formata SQL
spring.jpa.properties.hibernate.format_sql=true

# mostra comentários do Hibernate
spring.jpa.properties.hibernate.use_sql_comments=true

# dialeto do postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# timezone
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# ==========================================
# LOGS SQL (mais detalhado)
# ==========================================

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==========================================
# JACKSON
# ==========================================

spring.jackson.time-zone=America/Sao_Paulo


# Swagger/OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# caminho customizado (opcional)
springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/api-docs